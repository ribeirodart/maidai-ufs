services:
  maidai:
    build: .
    image: maidai-ufs:latest
    command: ["--no-gui"]
    shm_size: "8gb"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./data/evidence:/app/data/evidence
      - maidai-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  maidai-gui:
    extends:
      service: maidai
    profiles: ["gui"]
    command: ["--evidence", "/app/data/evidence"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./data/evidence:/app/data/evidence
      - maidai-cache:/root/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix

volumes:
  maidai-cache:
